<style>
  :root{
    color-scheme: light;
    --forest:#2F4A3C; --forest-dark:#1F3329; --forest-light:#3E6350;
    --gold:#C9A227; --gold-light:#E0C15C;
    --clay:#B5654A; --clay-light:#CB8268;
    --cream:#F6F1E7; --cream-dark:#EDE4D0; --paper:#FFFDF8;
    --ink:#241E14; --ink-soft:#4A4433; --muted:#857C62; --line:#DDD3BC;
    --display:'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
    --body:'Figtree', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:var(--body); color:var(--ink); background:var(--forest-dark);
    background-image:
      radial-gradient(circle at 12% 6%, rgba(201,162,39,0.13), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(181,101,74,0.16), transparent 46%);
    min-height:100vh; padding-inline:16px;
  }
  h1,h2,h3,h4{font-family:var(--display); text-wrap:balance;}
  .shell{max-width:720px; margin:0 auto; padding-block:20px 56px;}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--cream); padding-bottom:16px; min-height:38px;}
  .brand{display:flex; flex-direction:column; align-items:flex-start; gap:2px; background:none; border:none; color:var(--cream); cursor:pointer; padding:0; text-align:left;}
  .brand-name{font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:0.16em;}
  .brand-tag{font-family:var(--body); font-weight:600; font-size:11.5px; color:var(--gold-light);}
  .brand span{color:var(--gold-light);}
  .top-right{display:flex; align-items:center; gap:10px;}
  .pct{font-size:12px; color:rgba(246,241,231,0.72); font-variant-numeric:tabular-nums;}
  .home-btn{white-space:nowrap; flex-shrink:0; font:700 12.5px var(--body); color:var(--forest-dark); background:var(--gold); border:none; border-radius:999px; padding:7px 13px; cursor:pointer;}

  .card{background:var(--cream); border-radius:22px; padding:30px 30px 24px; box-shadow:0 24px 60px rgba(0,0,0,0.3); animation:rise .45s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:.4; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .kicker{font-size:11.5px; font-weight:700; letter-spacing:0.13em; color:var(--clay); text-transform:uppercase; margin:0 0 6px;}
  .card h2{font-size:clamp(22px,4.6vw,28px); font-weight:800; color:var(--forest-dark); margin:0 0 10px; line-height:1.15; letter-spacing:-0.01em;}
  .lead{font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 18px; max-width:62ch;}
  .small{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin:20px 0 8px;}

  /* HERO */
  .hero{text-align:center; display:flex; flex-direction:column; align-items:center;}
  .hero h1{font-size:clamp(30px,7vw,46px); font-weight:800; line-height:1.03; letter-spacing:-0.025em; color:var(--forest-dark); margin:4px 0 14px;}
  .hero h1 em{font-style:normal; color:var(--clay);}
  .hero .lead{text-align:center; margin-inline:auto;}
  .venn{width:100%; max-width:290px; margin:2px auto 8px;}
  .venn .ring{transform-origin:center; transform-box:fill-box; animation:breathe 6s ease-in-out infinite;}
  .venn .ring.r2{animation-delay:-2s;} .venn .ring.r3{animation-delay:-4s;}
  @keyframes breathe{50%{transform:scale(1.04);}}
  .badges{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:4px 0 22px;}
  .badge{font-size:12.5px; font-weight:600; color:var(--forest-dark); background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:6px 13px;}

  /* Buttons */
  .btn{font-family:var(--body); font-weight:700; font-size:14.5px; padding:12px 24px; border-radius:999px; border:none; cursor:pointer; transition:transform .12s, background .15s;}
  .btn:active{transform:scale(0.97);}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .btn-primary{background:var(--forest); color:#fff;}
  .btn-primary:hover{background:var(--forest-light);}
  .btn-gold{background:var(--gold); color:var(--forest-dark);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-big{padding:15px 36px; font-size:16px; box-shadow:0 8px 22px rgba(47,74,60,0.28);}
  .btn-ghost{background:transparent; color:var(--muted); padding:12px 6px;}
  .btn-ghost:hover{color:var(--forest-dark);}
  .btn-soft{background:var(--paper); color:var(--forest-dark); border:1.5px solid var(--line);}
  .btn-soft:hover{border-color:var(--gold);}
  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:10px; flex-wrap:wrap;}

  /* Pick cards */
  .pick{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; font:inherit; color:inherit; border:2px solid var(--line); background:var(--paper); border-radius:16px; padding:16px 18px; cursor:pointer; transition:border-color .15s, transform .15s, background .15s;}
  .pick:hover{border-color:var(--gold); transform:translateY(-2px);}
  .pick.selected{border-color:var(--forest); background:var(--cream-dark);}
  .pick .ico{font-size:28px; line-height:1; flex-shrink:0;}
  .pt{font-family:var(--display); font-weight:700; font-size:17px; color:var(--forest-dark); display:block; margin-bottom:3px;}
  .pd{font-size:13.5px; color:var(--ink-soft); line-height:1.45;}
  .time{display:inline-block; font-size:11px; font-weight:700; color:var(--clay); background:var(--cream); border-radius:999px; padding:2px 9px; margin-top:7px;}
  .tick{margin-left:auto; width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;}
  .pick.selected .tick,.tick.ok{background:var(--forest); border-color:var(--forest);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* Hub */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .tile{position:relative; display:flex; flex-direction:column; gap:6px; text-align:left; font:inherit; color:var(--cream); border:none; border-radius:18px; padding:18px; cursor:pointer; background:var(--forest); transition:transform .15s, box-shadow .15s; min-height:170px;}
  .tile:hover{transform:translateY(-3px); box-shadow:0 12px 26px rgba(31,51,41,0.3);}
  .tile.t2{background:var(--forest-light);} .tile.t3{background:var(--clay);} .tile.t4{background:var(--forest-dark);}
  .tile .ti{font-size:30px; line-height:1;}
  .tile .tt{font-family:var(--display); font-weight:800; font-size:19px; line-height:1.1;}
  .tile .td{font-size:13px; line-height:1.4; opacity:0.9; flex:1;}
  .bar{height:6px; border-radius:3px; background:rgba(246,241,231,0.22); overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--gold-light); border-radius:3px; transition:width .4s;}
  .status{font-size:11.5px; font-weight:700; opacity:0.9;}
  .reco{position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; background:var(--gold); color:var(--forest-dark); border-radius:999px; padding:3px 9px;}
  .carte-btn{display:flex; align-items:center; gap:14px; width:100%; margin-top:12px; text-align:left; font:inherit; border:2px dashed var(--gold); background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer; color:var(--forest-dark);}
  .carte-btn:hover{background:#fff;}

  /* Principle / colored cards */
  .principle{border-radius:16px; padding:18px 20px; color:var(--cream); background:var(--forest);}
  .principle.c2{background:var(--forest-light);} .principle.c3{background:var(--clay);} .principle.c4{background:var(--forest-dark);}
  .principle h3{margin:0 0 6px; font-size:18px; font-weight:700; line-height:1.2;}
  .principle p{margin:0; font-size:14.5px; line-height:1.5; opacity:0.95;}
  .more{background:none; border:none; color:var(--gold-light); font:600 12.5px var(--body); padding:8px 0 0; cursor:pointer;}
  .more-text{font-size:13.5px; line-height:1.55; opacity:0.92; margin-top:8px; padding-top:8px; border-top:1px solid rgba(246,241,231,0.22);}
  .react{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .react button{flex:1 1 auto; font:600 12.5px var(--body); padding:8px 10px; border-radius:10px; border:1.5px solid rgba(246,241,231,0.3); background:rgba(246,241,231,0.08); color:var(--cream); cursor:pointer;}
  .react button:hover{background:rgba(246,241,231,0.18);}
  .react button.active{background:var(--gold); border-color:var(--gold); color:var(--forest-dark);}
  .principle input{width:100%; margin-top:10px; padding:9px 12px; border-radius:9px; border:none; font:13px var(--body);}

  /* Accordion questions */
  .q-head{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; border:2px solid var(--line); background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer;}
  .q-head:hover{border-color:var(--gold);}
  .q-head.open{border-color:var(--forest); border-bottom-left-radius:6px; border-bottom-right-radius:6px;}
  .q-num{font:800 13px var(--display); color:var(--gold-light); background:var(--forest); border-radius:10px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .q-body{border:2px solid var(--forest); border-top:none; border-radius:0 0 16px 16px; margin-top:-12px; padding:18px 16px 16px; background:#fff; display:flex; flex-direction:column; gap:12px;}

  /* Chips */
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font:600 13px var(--body); border:1.5px solid var(--line); background:var(--paper); color:var(--forest-dark); border-radius:999px; padding:8px 14px; cursor:pointer; transition:all .15s;}
  .chip:hover{border-color:var(--gold);}
  .chip.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .chip.clay.active{background:var(--clay); border-color:var(--clay);}
  .chip.sm{font-size:11.5px; padding:5px 11px;}

  /* Actor & theme cards */
  .mini{display:flex; gap:10px; align-items:flex-start; text-align:left; font:inherit; border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:12px 13px; cursor:pointer; color:var(--ink);}
  .mini:hover{border-color:var(--gold);}
  .mini.selected{border-color:var(--forest); background:var(--cream-dark);}
  .mini .e{font-size:22px; line-height:1;}
  .mini b{display:block; font-size:14px; color:var(--forest-dark);}
  .mini span.s{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  /* Ladder of scales */
  .ladder{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .ladder .arrow{color:var(--muted); font-size:12px;}
  .rung{font:700 12.5px var(--body); border:none; border-radius:999px; padding:8px 12px; cursor:pointer; color:var(--forest-dark); background:var(--cream-dark); transition:transform .15s;}
  .rung:hover{transform:translateY(-2px);}
  .rung.active{color:#fff;}

  /* Cycle */
  .cycle{width:100%; max-width:320px; display:block; margin:0 auto;}
  .steps8{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .step8{display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.4; color:var(--ink-soft); background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:9px 11px;}
  .step8 i{font-style:normal; font:800 12px var(--display); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .step8 b{color:var(--forest-dark); display:block;}

  /* Tabs */
  .tabs{display:flex; gap:6px; background:var(--cream-dark); padding:5px; border-radius:14px; margin-bottom:16px;}
  .tabs button{flex:1; font:700 13px var(--body); border:none; background:transparent; color:var(--forest-dark); border-radius:10px; padding:10px 6px; cursor:pointer;}
  .tabs button.active{background:var(--forest); color:#fff;}

  /* Domains */
  .domain{background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;}
  .domain-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
  .domain-name{font-weight:700; font-size:15px; color:var(--forest-dark);}
  .mood{font:700 12px var(--body); color:var(--forest-dark); background:var(--cream); border-radius:999px; padding:3px 10px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%; accent-color:var(--forest); cursor:pointer;}
  .scale{display:flex; justify-content:space-between; font-size:11px; color:var(--muted);}
  .tip{font-size:12.5px; color:var(--clay); margin-top:6px; line-height:1.45;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--forest-dark);}
  .field input,.field textarea{width:100%; font:14px var(--body); padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); outline:none;}
  .field input:focus,.field textarea:focus{border-color:var(--forest);}
  .row-inline{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .panel{background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;}
  .panel h4{margin:0 0 10px; font-size:15px; color:var(--forest-dark);}
  .mini-dim{display:grid; grid-template-columns:120px 1fr 22px; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px;}
  .mini-dim b{color:var(--clay); text-align:right; font-variant-numeric:tabular-nums;}
  .seg3{display:flex; gap:6px; margin-top:8px;}
  .seg3 button{flex:1; font:600 12px var(--body); border:1.5px solid var(--line); background:var(--cream); border-radius:9px; padding:7px 4px; cursor:pointer; color:var(--forest-dark);}
  .seg3 button.active{background:var(--clay); border-color:var(--clay); color:#fff;}

  /* Missions */
  .mission{display:grid; grid-template-columns:44px 1fr; gap:12px; background:var(--paper); border:2px solid var(--line); border-radius:16px; padding:16px; transition:border-color .15s;}
  .mission.on{border-color:var(--forest);}
  .mission .num{width:44px; height:44px; border-radius:14px; background:var(--forest); color:var(--gold-light); font:800 20px var(--display); display:flex; align-items:center; justify-content:center;}
  .mission.m2 .num{background:var(--forest-light);} .mission.m3 .num{background:var(--clay); color:var(--cream);} .mission.m4 .num{background:var(--gold); color:var(--forest-dark);}
  .mission h3{margin:2px 0 4px; font-size:17px; color:var(--forest-dark);}
  .mission p{margin:0; font-size:14px; line-height:1.5; color:var(--ink-soft);}
  .yes{margin-top:10px; font:700 12.5px var(--body); border:1.5px solid var(--line); background:var(--cream); color:var(--forest-dark); border-radius:999px; padding:6px 13px; cursor:pointer;}
  .mission.on .yes{background:var(--forest); border-color:var(--forest); color:#fff;}
  .tagbox{display:flex; gap:6px; margin-top:10px;}
  .tagbox input{flex:1; min-width:0; font:14px var(--body); padding:9px 12px; border:1.5px solid var(--line); border-radius:10px;}
  .actor{display:inline-flex; align-items:center; gap:6px; font:600 12.5px var(--body); background:var(--cream-dark); color:var(--forest-dark); border-radius:999px; padding:5px 6px 5px 12px;}
  .actor button{border:none; background:var(--paper); border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:12px; line-height:1; color:var(--muted);}
  .sync{width:100%; max-width:420px; display:block; margin:12px 0 2px;}

  .qrow{display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--forest); color:var(--cream); border-radius:14px; padding:14px 16px; font-size:14px; font-weight:600; line-height:1.4;}
  .qrow.clay{background:var(--clay);}
  .toggle{width:50px; height:28px; border-radius:15px; background:rgba(246,241,231,0.28); position:relative; cursor:pointer; flex-shrink:0; border:none; transition:background .2s;}
  .toggle.on{background:var(--gold);}
  .toggle .knob{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--cream); transition:left .2s;}

let waveBusy=false;
function wireWave(){
  const btn=$('waveBtn'); if(!btn) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep=ms=>new Promise(r=>setTimeout(r, reduce?Math.min(ms,350):ms));
  const wave=$('wave');
  const animR=(a,b,ms)=>new Promise(res=>{ if(reduce){ res(); return; } const t0=performance.now(); wave.setAttribute('opacity','0.9'); (function f(t){ const k=Math.min(1,(t-t0)/ms); wave.setAttribute('r',(a+(b-a)*k).toFixed(1)); if(k<1) requestAnimationFrame(f); else { wave.setAttribute('opacity','0'); res(); } })(t0); });
  btn.onclick = async () => {
    if(waveBusy) return; waveBusy=true; btn.disabled=true;
    const cap=$('waveCap'), rings=[...document.querySelectorAll('.rings .rg')], net=$('net'), moi=$('moiC');
    const alive=()=>document.body.contains(cap);
    rings.forEach(r=>r.classList.remove('in','up')); net.classList.remove('on'); moi.classList.remove('up');
    const down=["🌍 La <b>vie</b> influence la <b>société</b>…","…la société façonne nos <b>territoires</b>…","…nos territoires font vivre <b>filières</b> et <b>entreprises</b>…","…qui rythment nos <b>familles</b> et nos <b>voisinages</b>…","…jusqu'à <b>chacun de nous</b>."];
    const radii=[136,114,92,70,48,26];
    for(let i=0;i<5;i++){ if(!alive()) break; cap.innerHTML=down[i]; rings[i].classList.add('in'); await animR(radii[i],radii[i+1],900); await sleep(1500); }
    if(!alive()){ waveBusy=false; return; }
    moi.classList.add('up'); await sleep(900);
    cap.innerHTML="<b>Et à l'inverse\u00a0?</b> Nous aussi, nous influençons…"; await sleep(2000);
    const up=["…nos <b>proches</b> et nos <b>voisins</b>…","…nos <b>filières</b> et nos <b>entreprises</b>…","…nos <b>territoires</b>…","…la <b>société</b>…","…et la <b>vie</b> elle-même."];
    for(let i=4;i>=0;i--){ if(!alive()) break; cap.innerHTML=up[4-i]; rings[i].classList.remove('in'); rings[i].classList.add('up'); await animR(radii[i+1],radii[i],900); await sleep(1400); }
    if(alive()){ cap.innerHTML="<b>Chaque cercle compte.</b>"; btn.textContent='↺ Rejouer'; btn.disabled=false; }
    waveBusy=false;
  };
}

function wireUntangle(scope){
  const w=scope.querySelector('.dwrap'); if(!w) return;
  const apply=on=>{ w.classList.toggle('untangled',on); w.querySelectorAll('.nd').forEach(g=>{ const p=(on?g.dataset.o:g.dataset.t).split(','); g.style.transform=`translate(${p[0]}px,${p[1]}px)`; }); $('untangleBtn').textContent=on?'↺ Rejouer':'✨ Démêler tout ça'; };
  if(state.untangled) apply(true);
  $('untangleBtn').onclick=()=>{ state.untangled=!state.untangled; save(); apply(state.untangled); };
}

function wireSlide(){
  const svg=document.querySelector('svg.slide'); if(!svg) return;
  const guy=svg.querySelector('.slider'), cap=svg.querySelector('.slide-cap'), pts=[...svg.querySelectorAll('.sp')];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ guy.setAttribute('cx',48); guy.setAttribute('cy',72); cap.textContent='7 étapes'; return; }
  const N=CYCLE.length-1, CLIMB=1800, PAUSE=700, SLIDE=6600, END=1400, TOTAL=CLIMB+PAUSE+SLIDE+END;
  const t0=performance.now(); let last=-1;
  const setCap=(i)=>{ if(i===last) return; last=i; cap.textContent=(i+1)+' · '+CYCLE[i].n; pts.forEach(p=>p.classList.toggle('on', +p.dataset.i===i)); };
  (function f(now){
    if(!document.body.contains(svg)) return;
    const e=(now-t0)%TOTAL;
    if(e<CLIMB){ const k=e/CLIMB; guy.setAttribute('cx',48); guy.setAttribute('cy',(270-198*k).toFixed(1)); setCap(0); }
    else if(e<CLIMB+PAUSE){ const k=(e-CLIMB)/PAUSE; guy.setAttribute('cx',(48+47*k).toFixed(1)); guy.setAttribute('cy',72); setCap(0); }
    else if(e<CLIMB+PAUSE+SLIDE){ const t=(e-CLIMB-PAUSE)/SLIDE; const [x,y]=slideBz(t); guy.setAttribute('cx',x.toFixed(1)); guy.setAttribute('cy',y.toFixed(1)); setCap(1+Math.min(N-1,Math.floor(t*N))); }
    else { const [x,y]=slideBz(1); guy.setAttribute('cx',x.toFixed(1)); guy.setAttribute('cy',y.toFixed(1)); }
    requestAnimationFrame(f);

function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#C9A227','#E0C15C','#B5654A','#F6F1E7','#3E6350'];
  const ps=Array.from({length:110},()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5, vx:(Math.random()-0.5)*3, vy:2+Math.random()*3, s:5+Math.random()*6, r:Math.random()*6, vr:(Math.random()-0.5)*0.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function tick(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }); if(++t<200) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

      {sum:"+ Pourquoi une région, et pourquoi le Sud-Ouest", html:`<p><b>Les solutions existent déjà partout.</b> L'enjeu : les déployer à la bonne échelle, avec des <b>feuilles de route</b> et des <b>marchés intentionnels</b> (prospectifs). Ils sont validés techniquement par les <b>acteurs</b>, puis par les <b>citoyens</b>, pour garantir un <b>business plan territorial pérenne</b>.</p>
        <p><b>Les expériences locales l'ont prouvé.</b> Chiapas au Mexique, Rojava en Syrie… Chacune a montré qu'on peut vivre autrement. Et partout, la <b>coopération</b> fait ses preuves : les <b>villes en transition</b> en Angleterre, les <b>coopératives d'énergie</b> en Scandinavie, la monnaie <b>WIR</b> qui soutient l'économie suisse depuis 1934… L'enjeu n'est ni <b>nationaliste</b> ni <b>indépendantiste</b> : c'est l'<b>organisation</b>, la <b>gouvernance</b> et la <b>démocratie directe</b>. Mais sans une <b>région industrielle</b> qui s'inspire de cette organisation, il ne peut y avoir de <b>modèle économique</b> capable d'inspirer le monde.</p>
        <p><b>La région, le bon tremplin.</b> Assez grande pour produire intelligemment ce dont on a besoin, assez proche pour rester à taille humaine. Une région pilote inspire tout un pays, qui inspire à son tour le monde. Plus elle coopère, plus elle redistribue vers départements et communes (<b>subsidiarité</b>). C'est l'esprit du <b>biorégionalisme</b>.</p>
        <p><b>Le Sud-Ouest, un terreau naturel.</b> Le Pays Basque a traversé les siècles et les invasions, avec une langue dont on ignore encore l'origine. Son secret ? Il n'a jamais été réuni sous un seul roi. À la place, une longue tradition d'<b>autogestion</b> : des villages reliés entre eux, des assemblées locales, des règles partagées. Capable de montrer les muscles, mais surtout de <b>coopérer</b> quand il le fallait. Cet esprit a infusé tout le Sud-Ouest, des Girondins aux Cathares : un goût pour l'<b>autonomie</b> et l'<b>universalisme</b>, qui se complètent. Preuve vivante : <b>Mondragón</b>, née en 1956 au Pays Basque, est aujourd'hui l'un des plus grands groupes coopératifs au monde. Et le Pays Basque a la <b>monnaie locale la plus développée d'Europe</b> : l'<b>Eusko</b>.</p>
        <p><b>Une piste : Nouvelle-Aquitaine et Occitanie.</b> Une identité commune, un même bassin, celui de la Garonne. De quoi montrer comment mutualiser services publics et privés, jusqu'à réaffecter les bâtiments disponibles là où c'est utile.</p>
        <p class="slogan-pill">Autonome et universaliste : l'esprit du Sud-Ouest.</p>`},
      {sum:"+ Bordeaux-Mériadeck 2030 : 5 domaines, un même quartier", html:()=>`<p>Une proposition : réunir les 5 grands domaines dans <b>un même quartier</b> pour <b>mutualiser les services</b> publics et privés. Tout est à deux pas, et la coopération devient naturelle. Les lieux déjà présents peuvent accueillir chaque domaine :</p>
        ${THEMES.map(t=>`<div class="place">${t.e} <b>${t.lieu}</b> · ${t.ld}</div>`).join('')}
        <p><b>Et des bâtiments annexes</b> pour réunir d'autres thématiques\u00a0: l'<b>éducation</b> au <b>Rectorat</b>, par exemple.</p>
        <p><b>Des services publics mutualisés et ouverts.</b> Réunis au même endroit, ils travaillent main dans la main avec des représentants des autres acteurs\u00a0: <b>entreprises</b>, <b>associations</b>, <b>médias</b> et <b>citoyens</b>.</p>
        <p><b>Un accompagnement global, dans chaque quartier.</b> Plutôt qu'un bâtiment par service (CAF, France Travail…), ces lieux peuvent accompagner chacun près de chez lui, sur l'ensemble de sa situation : <b>emploi</b>, <b>mobilité</b>, <b>logement</b> et <b>services</b>. Cela demande un <b>plan de formation des agents</b> et une <b>réaffectation optimale</b> des bâtiments et des budgets.</p>
        <p><b>Tout est connecté.</b> Chaque projet, chaque filière prend en compte un maximum de paramètres. Les <b>thématiques</b> servent de porte d'entrée pour analyser la situation, les <b>besoins</b>, les <b>ressources</b> et les <b>accompagnements</b>. Chacun garde son sujet, comprend ses liens avec les autres et en maîtrise l'essentiel : c'est ainsi que naissent des <b>projets</b> et des <b>plans de développement aboutis</b>.</p>
        <p><b>Cap vers l'équilibre.</b> Que chacun ait une activité alignée avec ses aspirations, un logement proche, une mobilité fluide et des services bien répartis, grâce à des investissements équitables et durables. On estime aussi le nombre d'heures nécessaires pour produire ce dont la population a besoin, réparties entre les citoyens en capacité de produire, selon leurs aspirations.</p>
        <p><b>Un engagement progressif.</b> Un engagement général de chaque citoyen à contribuer peut s'envisager à terme. Dans la <b>phase de transition</b>, ce sont d'abord certains <b>secteurs d'activité</b> qui s'engagent à produire, et leurs <b>collaborateurs</b> avec eux. Le <b>marché intentionnel</b> (prospectif) gagne ainsi une <b>garantie de pérennité</b>, de la formation à la production et à la distribution.</p>
        <p><b>Un exemple concret.</b> Emploi, logement, finance, éducation : aujourd'hui l'information est dispersée. Une annonce immobilière pourrait passer par une <b>agence publique locale</b>, où les pros sont rémunérés pour le service rendu (comme un médecin payé pour bien soigner, pas pour multiplier les actes). Même logique pour tous les métiers, selon les <b>besoins réels</b> de chaque territoire. Des interfaces locales mettraient le marché local en avant, sans rien interdire : l'import reste possible s'il respecte le marché local, l'environnement et la loi.</p>
        <p><b>Cercles et sous-cercles.</b> Chaque thématique et chaque échelle a son cercle de coopération, et ses sous-cercles (« Psychologie » dans « Santé », par exemple). Données, projets, votes et évaluations circulent de l'un à l'autre.</p>
        <p><b>Un exemple concret, la mobilité.</b> Transports gratuits et fréquents, centre apaisé, réseau vélo continu, sécurité, filière régionale.</p>
        <a class="ex-doc" href="plan-mobilite.html">📄 <span><b>Ouvrir le plan mobilité</b><small>Exemple de plan de développement territorial</small></span><i>→</i></a>`},
];
const DOCS = [
  {k:'legitime', e:'🤔', t:'Pourquoi personne ne se sent légitime de proposer une meilleure organisation territoriale ?', s:"Une science existe, tout le monde la souhaite… et personne ne s'en saisit", html:()=>`<p><b>Un constat simple.</b> Aucun acteur, aucun outil, aucune filière, aucun territoire ne s'inscrit dans un <b>plan de développement territorial concerté</b>.</p>
<p>C'est pourtant la seule méthode pour rendre toute initiative <b>viable et pérenne</b>.</p>
<p><b>Le paradoxe.</b> Une science met en avant la nécessité d'un tel dispositif, dans l'intérêt de tous. Tout le monde aimerait qu'un <b>système intelligent</b> soit mis en place.</p>
<p>Mais personne ne se sent légitime de le faire. Alors, faute d'organisation, chacun tire la couverture à soi.</p>
<p><b>1. La complémentarité oubliée.</b> Il existe de très nombreux acteurs de la transition. Aucun n'a de stratégie pour mettre en avant la <b>complémentarité des outils</b> proposés.</p>
<p>C'est pourtant ce qui augmenterait l'efficacité des accompagnements et la visibilité du réseau de la transition.</p>
<p><b>2. La région oubliée.</b> Personne n'a compris l'importance d'une <b>région</b> pour porter ce plan. Sinon, on aurait posé une question simple aux habitants :</p>
<p><i>« Est-il possible que notre région produise intelligemment ce dont la population a besoin ? »</i></p>
<p>On se serait alors rendu compte que la région et la <b>résilience territoriale systémique</b> sont une particularité de Bordeaux et du Sud-Ouest.</p>
<p><b>3. La posture de médiateur oubliée.</b> Il est assez simple de vérifier qui a cette posture de <b>médiateur territorial</b>, comme pouvait l'avoir <b>Bernard Charbonneau</b>.</p>
<p>Dans les années 1970, l'État confie l'aménagement du littoral à la <b>MIACA</b>. Son schéma de 1972 est jugé arbitraire, et les associations se mobilisent.</p>
<p>Le 6 juillet 1973, Charbonneau et Jacques Ellul lancent le <b>Comité de défense de la côte aquitaine</b>. Son orientation : l'<b>autogestion</b>. Sa mission : informer les habitants des enjeux, réunir les personnes concernées, et inciter la population à <b>définir elle-même son type de développement</b>.</p>
<p>Le comité essaime en <b>comités locaux</b> : Capbreton, Bassin d'Arcachon, Lacanau, Nord-Médoc. Face à cette mobilisation, la MIACA ouvre une vaste concertation avec les associations : une première !</p>
<p>Deux avancées en sortent : penser l'aménagement <b>au-delà de chaque commune</b>, et se concerter <b>bien en amont</b> des projets.</p>
<p><b>Le vrai rôle du médiateur.</b> Charbonneau n'a pas été le coach, l'arbitre ou l'animateur du dispositif. Il a lancé la dynamique, puis il s'est effacé, pour que les acteurs deviennent autonomes dans leur propre gestion.</p>
<p>La preuve : on l'a oublié, pendant et après. Alors que c'est lui qui a eu l'initiative.</p>
<p>Un dispositif unique et exceptionnel dans une région industrielle. Mais des bénévoles, sans outils, face aux professionnels de l'État, finissent par s'essouffler. En 1988, la MIACA disparaît, les associations perdent leurs interlocuteurs, et la région ne reprend pas le flambeau.</p>
<p><b>Une histoire si importante, et pourtant si peu connue.</b></p>
<p><b>Ce qui manquait : le numérique.</b> Sans outils informatiques, la concertation devient chronophage et incertaine, dans un monde en perpétuelle fluctuation.</p>
<p>C'est aussi pourquoi le <b>Rojava</b> n'a pas pu organiser de référendum : tout le monde n'avait pas accès à un outil démocratique, numérique et rapide, pour établir officiellement la volonté du peuple et faire respecter le droit international, en l'occurrence l'<b>autodétermination des peuples</b>.</p>
<p><b>Aujourd'hui, les outils existent.</b> La Géomédiation relie une méthode, des médiateurs et une plateforme, pour que chaque territoire puisse enfin s'organiser.</p>
<p><b>Comment vérifier ?</b> C'est simple : par un <b>sondage auprès de tous les acteurs</b>. Il suffit de regarder si quelqu'un a organisé un tel sondage en 15 ans.</p>
<p><b>Je l'ai vérifié. Et j'ai vérifié que personne ne l'a vérifié.</b></p>
<p class="small">Othman Kerrache, géographe, médiateur territorial indépendant</p>
<p class="small">Sources : Timothée Duverger, <a href="https://www.persee.fr/doc/anami_0003-4398_2014_num_126_287_8726" target="_blank" rel="noopener">« La praxis écologique de Bernard Charbonneau : une défense de la Côte aquitaine dans les années 1970 »</a>, Annales du Midi, 2014 · <a href="https://books.openedition.org/pumi/25891" target="_blank" rel="noopener">« La construction d'une économie touristique sur la Côte Aquitaine », chapitre 6</a>, Presses universitaires du Midi · <a href="https://www.sepanso.org/wp-content/uploads/2025/12/son_178-complet.pdf" target="_blank" rel="noopener">« L'aménagement de la côte aquitaine, de la MIACA à nos jours »</a>, Sud-Ouest Nature n°178, SEPANSO.</p>`},

  {k:'debat', e:'🗣️', t:'Kit débat', s:'Organiser un débat citoyen en 5 étapes', html:()=>`<p><b>Un débat où chacun a sa place.</b> Pas besoin d'être expert : il suffit d'une salle, de quelques tables, et de l'envie de faire parler les habitants entre eux. L'organisateur reste <b>en retrait</b> : ce sont les participants qui débattent, à égalité de parole.</p>
<p><b>1. Préparer, 2 à 3 semaines avant.</b> Une salle gratuite et accessible (associative, tiers-lieu), un coin pour les enfants. Des flyers dans les commerces, cafés et associations. Un formulaire d'inscription où chacun propose un <b>sujet</b>. Le matériel : tables, Post-it, stylos, une boîte à idées par table.</p>
<p><b>2. Accueillir.</b> Un brise-glace léger (« Votre musique préférée ? ») pour montrer que nos goûts sont variés, sans conflit. Puis un mot d'accueil de <b>2 minutes maximum</b> : pourquoi ce débat est différent, ce qu'on attend de chacun, comment on commence.</p>
<p><b>3. Une table par sujet, trois rôles.</b> Entre 5 et 15 participants par table. Le <b>secrétaire</b> note l'essentiel (le seul rôle indispensable). Le <b>facilitateur</b> aide sans orienter. Le <b>gestionnaire</b> répartit la parole et le temps.</p>
<p><b>4. Le débat en 5 étapes.</b> Cartes sur table : chacun note ses idées sur un Post-it. Un premier vote pour voir les tendances. Un tour de table. On négocie pour converger. Puis le vote final.</p>
<p><b>5. Voter au jugement majoritaire.</b> Chacun donne une mention à chaque proposition, de « excellent » à « à rejeter ». L'application gratuite <b>Urne</b> de Mieux Voter, ou de simples bulletins papier, suffisent.</p>
<p><b>Si ça coince.</b> Quelqu'un prend trop la parole ? On ne le juge jamais, on redonne la parole au groupe. Un blocage ? Plan B : chacun écrit son opinion, celle de l'autre, puis les points d'entente.</p>
<p><b>6. Après le débat.</b> Un compte-rendu fidèle, envoyé aux participants et aux élus. Un appel aux participants clés deux semaines plus tard. Une rétrospective de l'équipe : ce qui a marché, ce qui a freiné.</p>
<p><b>7. Et avec la Géomédiation.</b> On <b>célèbre</b> chaque proposition adoptée, pour donner envie de revenir. Et chaque débat rejoint les autres : les thématiques et les échelles se relient, et un médiateur oriente les propositions vers les bons acteurs.</p>
<p class="small">Inspiré du guide « Organisez votre débat Parlons-en » de l'association 3R (licence Creative Commons BY-SA). <a href="https://rrr.netlib.re/IMG/pdf/organisez-votre-debat-parlons-en.pdf" target="_blank" rel="noopener">Télécharger le guide complet</a>.</p>`},
  {k:'comparatif', e:'📊', t:'Géographes et méthodes coopératives : le comparatif', s:'Ce que chaque méthode relie, et ce qui manque', html:()=>`<p><b>Chaque étape existe déjà quelque part.</b> La Géomédiation les relie toutes, à toutes les échelles et dans toutes les thématiques, avec une méthode simple pour chacun.</p><div class="cmp-wrap"><table class="cmp"><tr><th class="cm">Méthode</th><th><span>Sensibilisation</span></th><th><span>Besoins</span></th><th><span>Ressources</span></th><th><span>Co-développement</span></th><th><span>Votation</span></th><th><span>Évaluation</span></th><th><span>Célébration</span></th><th><span>Toutes les échelles</span></th><th><span>Toutes les thématiques</span></th><th><span>Accessible à tous</span></th></tr><tr><td class="cm"><b>Patrick Geddes</b><small>urbaniste, 1854-1932</small></td><td><i class="cd p"></i></td><td><i class="cd f"></i></td><td><i class="cd f"></i></td><td><i class="cd p"></i></td><td></td><td></td><td></td><td><i class="cd p"></i></td><td><i class="cd p"></i></td><td></td></tr><tr><td class="cm"><b>Alberto Magnaghi</b><small>école territorialiste</small></td><td><i class="cd p"></i></td><td><i class="cd p"></i></td><td><i class="cd f"></i></td><td><i class="cd f"></i></td><td><i class="cd p"></i></td><td></td><td></td><td><i class="cd p"></i></td><td><i class="cd f"></i></td><td></td></tr><tr><td class="cm"><b>Pierre Calame</b><small>ingénieur, gouvernance</small></td><td><i class="cd p"></i></td><td><i class="cd p"></i></td><td><i class="cd p"></i></td><td><i class="cd f"></i></td><td></td><td><i class="cd p"></i></td><td></td><td><i class="cd f"></i></td><td><i class="cd f"></i></td><td></td></tr><tr><td class="cm"><b>Elinor Ostrom</b><small>prix Nobel 2009, les communs</small></td><td></td><td><i class="cd p"></i></td><td><i class="cd f"></i></td><td><i class="cd f"></i></td><td><i class="cd f"></i></td><td><i class="cd f"></i></td><td></td><td><i class="cd f"></i></td><td><i class="cd p"></i></td><td><i cla const STORE='geomediation_reves_v1';
function fresh(){ return {view:'home', dream:null, hist:[], lvl:{}, a:{}, acc:{}, dec:{}, test:{}, sendSel:{}, sendTo:'med', sendAddr:''}; }
let state=fresh();
function cleanV(v,d){ d=d||0; if(d>8) return null;
  if(typeof v==='string') return v.replace(/[<>]/g,'').slice(0,3000);
  if(typeof v==='number') return isFinite(v)?v:0;
  if(typeof v==='boolean'||v===null) return v;
  if(Array.isArray(v)) return v.slice(0,300).map(x=>cleanV(x,d+1));
  if(typeof v==='object'){ const o={}; Object.keys(v).slice(0,400).forEach(k=>{ if(k==='__proto__'||k==='constructor'||k==='prototype') return; o[String(k).replace(/[<>]/g,'').slice(0,100)]=cleanV(v[k],d+1); }); return o; }
  return null; }
function safeState(sv){ if(!sv||typeof sv!=='object'||Array.isArray(sv)) return null; const s=Object.assign(fresh(),cleanV(sv));
  if(!['home','dream','recap','legal','doc'].includes(s.view)) s.view='home';
  if(s.dream!=null && !DREAMS.some(x=>x.k===s.dream)){ s.dream=null; if(s.view==='dream') s.view='home'; }
  ['a','acc','dec','test','sendSel','lvl'].forEach(k=>{ if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k])) s[k]={}; });
  if(!Array.isArray(s.hist)) s.hist=[];
  if(!['med','autre','libre'].includes(s.sendTo)) s.sendTo='med';
  return s; }
try{ const sv=safeState(JSON.parse(localStorage.getItem(STORE)||'null')); if(sv) state=sv; }catch(e){}
try{ const m=location.hash.match(/^#reprise=(.+)$/); if(m){ const sv=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
  const ok=safeState(sv); if(ok && confirm('Recharger votre fiche Géomédiation sur cet appareil ?')){ state=Object.assign(ok,{view:'recap',hist:[]}); try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
  history.replaceState(null,'',location.href.split('#')[0]); } }catch(e){}
function resumeLink(){ const s=Object.assign({},state,{hist:[],view:'recap'}); return location.href.split('#')[0]+'#reprise='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(s))))); }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
document.addEventListener('input',()=>setTimeout(save,0));
function A(dk){ return state.a[dk]||(state.a[dk]={}); }
function go(view, dream){ state.hist=(state.hist||[]).concat({v:state.view,d:state.dream}).slice(-30); state.view=view; if(dream!==undefined) state.dream=dream; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goBack(){ const p=(state.hist||[]).pop(); if(p){ state.view=p.v; state.dream=p.d; } else state.view='home'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function lvlTodo(d,i){ const a=state.a[d.k]||{}; return ((d.levels[i]||{}).fields||[]).filter(f=>['chips','chips1','cards1','cardsN','scales','range','stepsEval','stepsEvalMulti','domainsEval'].includes(f.type)).filter(f=>{ const v=a[f.k]; return v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length); }); }
function answered(dk){ const a=state.a[dk]||{}; return Object.values(a).filter(v=>Array.isArray(v)?v.length:(v!==''&&v!==false&&v!=null&&!(typeof v==='object'&&!Object.keys(v).length))).length + Object.values((state.dec||{})[dk]||{}).filter(Boolean).length; }

/* ================= CHAMPS ================= */
function mood(v){ return v<=1 ? 'à découvrir' : v<=3 ? 'en bonne voie' : 'j\'en prends grand soin'; }
function paintFb(box, items, act){
  const touched=items.some(x=>x.v>0);
  if(!touched){ box.className='fb'; box.innerHTML='💡 Bougez les curseurs\u00a0: un conseil personnalisé s\'affiche ici.'; return null; }
  const avg=items.reduce((t,x)=>t+x.v,0)/items.length, low=[...items].sort((a,b)=>a.v-b.v)[0];
  const head= avg<2 ? "🌱 <b>Plein de belles avancées en vue\u00a0!</b> Chaque petit pas compte." : avg<4 ? "🌿 <b>Belle base\u00a0!</b> Vous êtes sur la bonne voie." : "🌳 <b>Bravo, vous avez déjà bien avancé\u00a0!</b>";
  box.className='fb on'; box.innerHTML=`${head}<span class="fb-tip">👉 Conseil\u00a0: <b>${low.n}</b> · ${low.tip}</span>`;
  if(act) act(box, low);
  return low;
}
function field(dk, f){
  const a=A(dk), w=h('div',{class:'fld'});
  if(!['stepsEval','invite','domainsEval','stepsEvalMulti','ideas'].includes(f.type)) w.appendChild(h('div',{class:'fld-label'},f.label));
  if(f.type==='chips'||f.type==='chips1'){
    const row=h('div',{class:'chip-row'}); const cur=a[f.k]||(f.type==='chips'?[]:null);
    f.opts.forEach(o=>{ const on=f.type==='chips'?cur.includes(o):cur===o;
      row.appendChild(h('button',{class:'chip'+(on?' active':''), 'aria-pressed':String(on), onclick:()=>{ if(f.type==='chips') a[f.k]=on?cur.filter(x=>x!==o):[...cur,o]; else a[f.k]=on?null:o; render(); }}, o)); });
    if(f.type==='chips'){
      cur.filter(x=>!f.opts.includes(x)).forEach(x=>row.appendChild(h('button',{class:'chip active','aria-label':'Retirer '+x, onclick:()=>{ a[f.k]=cur.filter(y=>y!==x); render(); }}, esc(x)+' ×')));
      state.other=state.other||{}; const ok=dk+'.'+f.k, open=!!state.other[ok];
      row.appendChild(h('button',{class:'chip'+(open?' active':''), 'aria-expanded':String(open), onclick:()=>{ state.other[ok]=!open; render(); if(!open) setTimeout(()=>{ const i=$('oth-'+dk+'-'+f.k); if(i) i.focus(); },30); }}, 'Autre'));
      w.appendChild(row);
      if(open){ const box=h('div',{class:'tagbox'}); const inp=h('input',{id:'oth-'+dk+'-'+f.k, type:'text', placeholder:'Précisez…', 'aria-label':'Autre : '+f.label.replace(/<[^>]+>/g,'')});
        const push=()=>{ const v=inp.value.trim(); if(v && !cur.includes(v)){ a[f.k]=[...cur,v]; state.other[ok]=false; render(); } };
        inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); push(); } };
        box.append(inp, h('button',{class:'btn btn-soft', style:'padding:8px 14px;font-size:13px', onclick:push},'OK')); w.appendChild(box); }
    } else w.appendChild(row);
  }
  if(f.type==='toggle'){
    const on=!!a[f.k]; w.innerHTML=''; const b=h('button',{class:'tgl'+(on?' on':''),'aria-pressed':String(on), onclick:()=>{ a[f.k]=!on; render(); }}, `<span class="box">${on?'✓':''}</span><span>${f.label}</span>`); w.appendChild(b);
  }
  if(f.type==='text'||f.type==='area'){
    const id='f-'+dk+'-'+f.k; w.firstChild.setAttribute && w.firstChild.remove(); w.appendChild(h('label',{class:'fld-label',for:id},f.label));
    const i=h(f.type==='area'?'textarea':'input',{id, placeholder:f.ph||''}); if(f.type==='text') i.type='text'; i.value=a[f.k]||''; i.oninput=e=>{ a[f.k]=e.target.value; }; w.appendChild(i);
  }
